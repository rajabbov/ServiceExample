  <g><g transform="translate(910,190)"><circle r="96" fill="none" stroke="#2C3450" stroke-width="10"/><circle r="96" fill="none" stroke="url(#acc)" stroke-width="10" stroke-linecap="round" stroke-dasharray="160 444"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/></circle><circle r="62" fill="#1E2438"/><path d="M-14 -24 L26 0 L-14 24Z" fill="#F5F6FA"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.5;.5;1;1" dur="4s" repeatCount="indefinite" calcMode="discrete"/></path><g opacity="0" fill="#F5F6FA"><rect x="-20" y="-24" width="13" height="48" rx="3"/><rect x="7" y="-24" width="13" height="48" rx="3"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.5;.5;1" dur="4s" repeatCount="indefinite" calcMode="discrete"/></g></g><text x="910" y="330" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="600" fill="#8B92AB" text-anchor="middle" >startForeground()</text><g><rect x="1030" y="70" width="190" height="78" rx="16" fill="#F5F6FA"/><rect x="1046" y="86" width="22" height="22" rx="6" fill="#818CF8"/><text x="1078" y="103" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1E2438" text-anchor="start" >ServiceExample</text><text x="1046" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#5A6178" text-anchor="start" >♪ Playing in background</text><animateTransform attributeName="transform" type="translate" values="0 -120;0 0;0 0;0 -120" keyTimes="0;.12;.88;1" dur="5s" repeatCount="indefinite"/></g><rect x="1040" y="210" width="48" height="40" rx="12" fill="#1E2438" stroke="#2C3450"/><text x="1064" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#F5F6FA" text-anchor="middle" >▶</text><rect x="1098" y="210" 