<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="ServiceExample">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#161B2E"/>
  </linearGradient>
  <radialGradient id="glow" cx="78%" cy="45%" r="55%">
    <stop offset="0" stop-color="#818CF8" stop-opacity=".28"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#818CF8"/><stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity=".05"/>
  </pattern>
  <clipPath id="card"><rect width="1280" height="400" rx="28"/></clipPath>
</defs>
<g clip-path="url(#card)">
