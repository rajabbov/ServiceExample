  <text x="62" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="64" font-weight="800" fill="#F5F6FA" letter-spacing="-1">ServiceExample</text>
  <text x="64" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#B7BCD0">Background vs foreground services,</text><text x="64" y="240" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#B7BCD0">with music that keeps playing.</text>
